<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apex Owner">
<meta name="theme-color" content="#000000">
<title>Apex Owner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23000'/%3E%3Cpath d='M2 20 L10 6 L13 11 L15.5 8 L22 20 Z' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #000; --card: rgba(255,255,255,.06); --card2: rgba(255,255,255,.1); --fg: #f2f2f2; --muted: #a3a3a3; --dim: #6f6f6f;
  --line: rgba(255,255,255,.1); --accent: #ededed; --on-accent: #000;
  --good: #8fe3a5; --warn: #ffd27a; --bad: #ff8a80; --block: #c9a7ff;
  --font: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.top { position: sticky; top: 0; z-index: 5; background: rgba(0,0,0,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px; border-bottom: 1px solid var(--line); }
.top-in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .16em; font-size: 13px; color: #ccc; text-decoration: none; }
.brand svg { width: 22px; height: 22px; }
.brand small { letter-spacing: .04em; font-weight: 600; color: var(--dim); font-size: 12px; }
.sync { font-size: 12.5px; color: var(--muted); text-align: right; }
.tabs { display: flex; gap: 4px; max-width: 920px; margin: 10px auto 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: transparent; color: var(--muted); padding: 8px 13px; border-radius: 999px; font-weight: 600; font-size: 14.5px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
main { max-width: 920px; margin: 0 auto; padding: 18px 16px calc(env(safe-area-inset-bottom) + 90px); }
h1 { font-size: 26px; letter-spacing: -.02em; margin: 4px 0 4px; }
h2 { font-size: 17px; margin: 26px 0 10px; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 14.5px; margin: 0 0 14px; }
.card { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: inset 0 0 0 1px var(--line); }
.list { display: grid; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat .k { color: var(--muted); font-size: 13px; }
.stat .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.stat .s { color: var(--dim); font-size: 12.5px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.row + .row { margin-top: 6px; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .small { font-size: 13.5px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--card2); color: var(--fg); white-space: nowrap; }
.badge.good { background: rgba(143,227,165,.14); color: var(--good); } .badge.warn { background: rgba(255,210,122,.14); color: var(--warn); }
.badge.bad { background: rgba(255,138,128,.14); color: var(--bad); } .badge.block { background: rgba(201,167,255,.14); color: var(--block); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 14.5px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn.g { background: var(--card2); color: var(--fg); } .btn.d { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px rgba(255,138,128,.4); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.soon { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px dashed var(--line); border: 1px dashed rgba(255,255,255,.14); color: var(--muted); font-size: 13.5px; }
.soon b { color: var(--fg); font-weight: 600; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.empty { color: var(--muted); padding: 18px; text-align: center; font-size: 14.5px; }
.err { color: var(--bad); font-size: 14px; }
input[type=text], input[type=date], input[type=time], input[type=search] { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); }
input:focus { outline: 2px solid rgba(255,255,255,.5); outline-offset: 1px; }
label.f { display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); }
.fg { display: grid; gap: 12px; }
.fg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chk { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.chk input { width: 20px; height: 20px; accent-color: #ededed; }
.wd { display: flex; gap: 6px; flex-wrap: wrap; }
.wd button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card2); color: var(--fg); font-weight: 650; cursor: pointer; }
.wd button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* schedule */
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.weeknav .lbl { font-weight: 650; }
.day { padding: 14px 16px 12px; }
.day.today { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.45); }
.day.past { opacity: .55; }
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dhead b { font-size: 16px; }
.dmeta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.bar { position: relative; height: 26px; border-radius: 8px; background: rgba(255,255,255,.035); margin: 12px 0 4px; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.bar i.free { background: rgba(143,227,165,.16); box-shadow: inset 0 0 0 1px rgba(143,227,165,.45); top: 3px; bottom: 3px; }
.bar i.event { background: rgba(255,255,255,.22); }
.bar i.block { background: repeating-linear-gradient(135deg, rgba(201,167,255,.45) 0 6px, rgba(201,167,255,.22) 6px 12px); }
.bar i.job { background: #ededed; }
.bar i.dark { background: rgba(0,0,0,.55); }
.ticks { position: relative; height: 14px; font-size: 10.5px; color: var(--dim); }
.ticks span { position: absolute; transform: translateX(-50%); }
.items { display: grid; gap: 6px; margin-top: 8px; }
.it { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.it .t { color: var(--muted); min-width: 136px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.it .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.it .dot.event { background: rgba(255,255,255,.4); } .it .dot.block { background: var(--block); } .it .dot.job { background: #ededed; } .it .dot.free { background: var(--good); }
.it .x { margin-left: auto; display: flex; gap: 6px; }
.lnk { white-space: nowrap; border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; padding: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* jobs */
.job { cursor: pointer; }
.job .when { font-weight: 650; }
.job .what { margin-top: 2px; }
.job .det { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; font-size: 14.5px; }
.kv { display: flex; justify-content: space-between; gap: 14px; }
.kv span { color: var(--muted); flex: 0 1 46%; } .kv b { font-weight: 600; text-align: right; flex: 1 1 54%; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.scroll { overflow-x: auto; }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: #111; border-radius: 22px 22px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); box-shadow: 0 -1px 0 var(--line); }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 22px; } }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); background: #ededed; color: #000; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 30; max-width: 90vw; text-align: center; }
@media (max-width: 520px) { .tabs { gap: 2px; } .tabs button { flex: 1 1 auto; padding: 7px 6px; font-size: 13px; } }
@media (max-width: 420px) { h1 { font-size: 23px; } .it { font-size: 13.5px; gap: 8px; } .it .t { min-width: 122px; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/admin/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20 L10 6 L13 11 L15.5 8 L22 20 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.3 9 L10 6 L11.8 9.2 L10 8.4 Z" fill="currentColor"/></svg>APEX <small>OWNER</small></a>
    <div class="sync" id="sync"></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="schedule">Schedule</button>
    <button role="tab" data-tab="jobs">Jobs</button>
    <button role="tab" data-tab="people">People</button>
    <button role="tab" data-tab="money">Money</button>
    <button role="tab" data-tab="settings">Settings</button>
  </nav>
</header>
<main id="main"></main>
<div id="sheetRoot"></div>

<script>
(function () {
  "use strict";
  var WEEK_RULES = {}, main = document.getElementById("main"), TAB = "today", WEEK_FROM = null, JOB_SCOPE = "upcoming", PEOPLE = "customers", Q = "";
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], DOWL = ["S", "M", "T", "W", "T", "F", "S"];
  var SIZES = ["Sedan", "SUV", "Truck"];

  // ---------- helpers ----------
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function api(path, opts) {
    return fetch("/api/admin" + path, Object.assign({ headers: { "Content-Type": "application/json" }, credentials: "same-origin" }, opts || {}))
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ("Error " + r.status)); return j; }); });
  }
  function post(path, body) { return api(path, { method: "POST", body: JSON.stringify(body || {}) }); }
  function tmin(m) { if (m == null) return ""; m = Math.round(m); var h = Math.floor(m / 60) % 24, mm = m % 60, ap = h >= 12 ? "PM" : "AM", h12 = h % 12 || 12; return h12 + (mm ? ":" + String(mm).padStart(2, "0") : "") + " " + ap; }
  function tshort(m) { var h = Math.floor(m / 60) % 24, ap = h >= 12 ? "p" : "a"; return (h % 12 || 12) + ap; }
  function dkey(d) { return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0"); }
  function pday(k) { var p = k.split("-"); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)); }
  function addD(k, n) { var d = pday(k); d.setUTCDate(d.getUTCDate() + n); return dkey(d); }
  function dlabel(k, long) { return pday(k).toLocaleDateString("en-US", { timeZone: "UTC", weekday: long ? "long" : "short", month: "short", day: "numeric" }); }
  function todayNY() { var s = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" }); return s; }
  function whenUtc(ms) { var d = new Date(ms); return d.toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }); }
  function timeUtc(ms) { return new Date(ms).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }); }
  function money(n) { n = +n || 0; return "$" + n.toLocaleString("en-US", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
  function ago(ms) { var s = (Date.now() - ms) / 1000; if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " hr ago"; return Math.round(s / 86400) + " days ago"; }
  function weekStart(k) { var d = pday(k); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return dkey(d); }   // Sunday
  function toast(msg) { var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
  function soon(what, now) { return '<div class="soon"><b>Coming soon:</b> ' + what + (now ? '<br>' + now : '') + '</div>'; }
  function loading() { main.innerHTML = '<p class="empty">Loading…</p>'; }
  function fail(e) { main.innerHTML = '<div class="card"><p class="err">' + esc(e.message) + '</p><div class="acts"><button class="btn g sm" data-reload>Try again</button></div></div>'; }
  var STATUS = { active: ["Active", "good"], pending: ["Starts soon", ""], past_due: ["Payment failed", "bad"], paused: ["Paused", "warn"], ending: ["Ending", "warn"], cancelled: ["Cancelled", ""] };
  function stBadge(s) { var x = STATUS[s] || [s, ""]; return '<span class="badge ' + x[1] + '">' + esc(x[0]) + '</span>'; }

  // ---------- tabs ----------
  function show(tab) {
    TAB = tab;
    [].forEach.call(document.querySelectorAll(".tabs button"), function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
    try { history.replaceState(null, "", "#" + tab); } catch (e) {}
    window.scrollTo(0, 0);
    ({ today: renderToday, schedule: renderSchedule, jobs: renderJobs, people: renderPeople, money: renderMoney, settings: renderSettings })[tab]();
  }

  function syncLine(s) {
    var el = document.getElementById("sync");
    if (!s) { el.textContent = "Calendar not synced yet"; return; }
    el.innerHTML = 'Calendar synced ' + esc(ago(s.at)) + ' · <button class="lnk" data-sync style="padding:0">Sync now</button>';
  }

  // ---------- Today ----------
  function jobLine(j) {
    return '<div class="card"><div class="row"><div><div style="font-weight:650">' + esc(whenUtc(j.start_utc)) + '–' + esc(timeUtc(j.end_utc)) + '</div>' +
      '<div>' + esc(j.what) + ' · ' + esc(j.name) + (j.town ? ' · ' + esc(j.town) : '') + '</div><div class="muted small">' + esc(j.car || "") + '</div></div>' +
      '<div style="display:grid;gap:6px;justify-items:end">' + (j.kind === "member" ? '<span class="badge block">Member</span>' : '') + (!j.acked ? '<span class="badge warn">New</span>' : '') + '</div></div>' +
      '<div class="acts">' + (j.job ? '<a class="btn sm" href="' + esc(j.job) + '">Open job</a>' : '') + (!j.acked ? '<button class="btn g sm" data-ack="' + esc(j.id) + '">Mark seen</button>' : '') + '</div></div>';
  }
  function renderToday() {
    loading();
    api("/home").then(function (d) {
      syncLine(d.sync);
      var h = '<h1>' + esc(dlabel(todayNY(), true)) + '</h1><p class="sub">Here\'s what\'s coming up.</p>';
      var att = [];
      if (d.unacked) att.push('<div class="row"><span>' + d.unacked + ' new booking' + (d.unacked > 1 ? 's' : '') + ' you haven\'t marked seen</span><button class="btn g sm" data-go="jobs">View</button></div>');
      if (d.unpaid.length) att.push('<div class="row"><span>' + d.unpaid.length + ' finished job' + (d.unpaid.length > 1 ? 's' : '') + ' not marked paid</span><button class="btn g sm" data-go="money">View</button></div>');
      if (d.pastDue) att.push('<div class="row"><span>' + d.pastDue + ' member' + (d.pastDue > 1 ? 's' : '') + ' with a failed payment</span><button class="btn g sm" data-go="people" data-people="members">View</button></div>');
      if (att.length) h += '<div class="card" style="box-shadow:inset 0 0 0 1px rgba(255,210,122,.35)"><div style="font-weight:650;margin-bottom:8px;color:var(--warn)">Needs you</div>' + att.join("") + '</div>';
      h += '<h2>Next up</h2>' + (d.next.length ? '<div class="list">' + d.next.map(jobLine).join("") + '</div>' : '<div class="card empty">No upcoming jobs yet.</div>');
      h += '<h2>This month</h2><div class="grid2">' +
        '<div class="card stat"><div class="k">Details paid</div><div class="v">' + money(d.month.details) + '</div><div class="s">' + d.month.jobs + ' job' + (d.month.jobs === 1 ? '' : 's') + '</div></div>' +
        '<div class="card stat"><div class="k">Tips</div><div class="v">' + money(d.month.tips) + '</div></div>' +
        '<div class="card stat"><div class="k">Memberships</div><div class="v">' + money(d.month.members) + '</div><div class="s">charged this month</div></div>' +
        '<div class="card stat"><div class="k">Members</div><div class="v">' + d.members.count + '</div><div class="s">' + money(d.members.monthly) + '/mo</div></div></div>';
      h += '<div class="acts" style="margin-top:16px"><button class="btn" data-newblock>Block off time</button><button class="btn g" data-go="schedule">See my week</button></div>';
      main.innerHTML = h;
    }).catch(fail);
  }

  // ---------- Schedule ----------
  var BAR0 = 7 * 60, BAR1 = 20 * 60;
  function pct(m) { return Math.max(0, Math.min(100, (m - BAR0) / (BAR1 - BAR0) * 100)); }
  function seg(cls, a, b, title) { if (b <= BAR0 || a >= BAR1) return ""; return '<i class="' + cls + '" style="left:' + pct(a) + '%;width:' + (pct(b) - pct(a)) + '%"' + (title ? ' title="' + esc(title) + '"' : '') + '></i>'; }
  function renderSchedule() {
    if (!WEEK_FROM) WEEK_FROM = weekStart(todayNY());
    loading();
    Promise.all([api("/week?from=" + WEEK_FROM + "&n=7"), api("/blockouts")]).then(function (r) {
      var w = r[0], bl = r[1].blockouts, today = todayNY(); WEEK_RULES = w.rules || {};
      var h = '<h1>Schedule</h1><p class="sub">Your calendar, blocked time and jobs. Green is open for bookings (already includes the 1-hour buffers). “Fits” uses sedan times.</p>';
      h += '<div class="weeknav"><button class="btn g sm" data-week="-7" aria-label="Previous week">‹ Prev</button><span class="lbl">' + esc(dlabel(w.from)) + ' – ' + esc(dlabel(addD(w.from, 6))) + '</span><button class="btn g sm" data-week="7" aria-label="Next week">Next ›</button></div>';
      h += '<div class="acts" style="margin:-4px 0 14px"><button class="btn sm" data-newblock>+ Block off time</button>' + (w.from !== weekStart(today) ? '<button class="btn g sm" data-week="0">This week</button>' : '') + '</div>';
      h += '<div class="legend"><span><i class="dot" style="width:10px;height:10px;border-radius:3px;background:rgba(143,227,165,.5)"></i>Open</span><span><i style="width:10px;height:10px;border-radius:3px;background:#ededed;display:inline-block"></i>Job</span><span><i style="width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.35);display:inline-block"></i>Calendar</span><span><i style="width:10px;height:10px;border-radius:3px;background:var(--block);display:inline-block"></i>Blocked</span></div>';
      h += '<div class="list">' + w.days.map(function (d) { return dayCard(d, today); }).join("") + '</div>';
      h += '<h2>Your blocked time</h2>';
      h += bl.length ? '<div class="list">' + bl.map(blockCard).join("") + '</div>' : '<div class="card empty">Nothing blocked yet. Use “Block off time” for classes, appointments or days you don\'t want jobs.</div>';
      main.innerHTML = h;
    }).catch(fail);
  }
  function dayCard(d, today) {
    var segs = "", items = "";
    segs += seg("dark", BAR0, w0(), "") + seg("dark", d.end, BAR1, "After cutoff");
    d.free.forEach(function (f) { segs += seg("free", f[0], f[1], "Open " + tmin(f[0]) + "–" + tmin(f[1])); });
    d.items.forEach(function (it) {
      if (it.allDay) { if (it.type === "block" || it.type === "calblock") segs += seg("block", BAR0, BAR1, it.title || "Blocked"); return; }

    if ((b = t.closest("#bWd button"))) { b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); return; }
    if ((b = t.closest("[data-delblock]"))) { if (!confirm("Delete this blocked time?")) return; api("/blockouts/" + b.dataset.delblock, { method: "DELETE" }).then(function () { toast("Deleted"); renderSchedule(); }).catch(function (e2) { toast(e2.message); }); return; }
    if ((b = t.closest("[data-skip]"))) { var wkly = b.dataset.weekly === "1"; if (!confirm(wkly ? "Skip it on " + dlabel(b.dataset.day) + " only?" : "Remove this blocked time?")) return;
      post("/blockouts/" + b.dataset.skip + "/skip", { day: b.dataset.day }).then(function () { toast(wkly ? "Skipped that day" : "Removed"); renderSchedule(); }).catch(function (e2) { toast(e2.message); }); return; }
    if ((b = t.closest("[data-ack]"))) { e.stopPropagation(); b.disabled = true; post("/jobs/" + b.dataset.ack + "/ack").then(function () { toast("Marked seen"); show(TAB); }); return; }
    if ((b = t.closest("[data-scope]"))) { JOB_SCOPE = b.dataset.scope; return renderJobs(); }
    if ((b = t.closest("[data-people]"))) { PEOPLE = b.dataset.people; return PCACHE[PEOPLE] ? drawPeople() : renderPeople(); }
    if (t.closest("a, button, input")) return;
    if ((b = t.closest("[data-job]"))) { var det = b.querySelector(".det"); if (det) det.hidden = !det.hidden; }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "pq") { Q = e.target.value; drawPeople(); } });
  document.addEventListener("change", function (e) { if (e.target.id === "bAll") document.getElementById("bTimes").hidden = e.target.checked; });
  document.addEventListener("submit", function (e) { if (e.target.id === "bf") { e.preventDefault(); saveBlock(e.target); } });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") document.getElementById("sheetRoot").innerHTML = ""; });

  var start = (location.hash || "").slice(1);
  show(["today", "schedule", "jobs", "people", "money", "settings"].indexOf(start) > -1 ? start : "today");
  api("/home").then(function (d) { syncLine(d.sync); }).catch(function () {});
})();
</script>
</body>
</html>
