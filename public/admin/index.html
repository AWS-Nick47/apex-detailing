<style>
:root {
  --bg: #000; --card: rgba(255,255,255,.06); --card2: rgba(255,255,255,.1); --fg: #f2f2f2; --muted: #b0b0b0; --dim: #8e8e8e;
  --line: rgba(255,255,255,.1); --accent: #ededed; --on-accent: #000;
  --good: #8fe3a5; --warn: #ffd27a; --bad: #ff8a80; --block: #c9a7ff; --blue: #8cb8ff;
  --font: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top { position: sticky; top: 0; z-index: 5; background: rgba(0,0,0,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px; border-bottom: 1px solid var(--line); }
.top-in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .16em; font-size: 13px; color: #ccc; text-decoration: none; }
.brand svg { width: 22px; height: 22px; }
.brand small { letter-spacing: .04em; font-weight: 600; color: var(--dim); font-size: 12px; }
.sync { font-size: 12.5px; color: var(--muted); text-align: right; display: flex; align-items: center; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.qpill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: rgba(255,210,122,.14); color: var(--warn); border: 0; cursor: pointer; }
.qpill.ok { background: rgba(143,227,165,.14); color: var(--good); }
.tabs { display: flex; gap: 4px; max-width: 920px; margin: 10px auto 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: transparent; color: var(--muted); padding: 8px 13px; border-radius: 999px; font-weight: 600; font-size: 14.5px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.bnr { max-width: 920px; margin: 10px auto 0; padding: 9px 12px; border-radius: 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; background: rgba(255,210,122,.1); color: var(--warn); box-shadow: inset 0 0 0 1px rgba(255,210,122,.25); }
main { max-width: 920px; margin: 0 auto; padding: 18px 16px calc(env(safe-area-inset-bottom) + 90px); }
h1 { font-size: 26px; letter-spacing: -.02em; margin: 4px 0 4px; line-height: 1.15; }
h2 { font-size: 17px; margin: 26px 0 10px; letter-spacing: -.01em; }
h2 .r { float: right; font-size: 14px; font-weight: 600; }
.sub { color: var(--muted); font-size: 14.5px; margin: 0 0 14px; }
.card { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: inset 0 0 0 1px var(--line); }
.list { display: grid; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat .k { color: var(--muted); font-size: 13px; }
.stat .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--dim); font-size: 12.5px; }
.taxc { margin-top: 10px; box-shadow: inset 0 0 0 1px rgba(200,247,197,.22); }
.qrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); } .qrow:first-child { padding-top: 2px; }
.qrow .qr { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; } .qrow .qr b { font-size: 17px; }
.taxc .k { color: var(--muted); font-size: 13px; } .taxc .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; } .taxc .s { color: var(--dim); font-size: 12.5px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.row + .row { margin-top: 6px; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .small { font-size: 13.5px; } .good { color: var(--good); } .warnc { color: var(--warn); } .badc { color: var(--bad); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--card2); color: var(--fg); white-space: nowrap; }
.badge.good, .st.paid { background: rgba(143,227,165,.14); color: var(--good); } .badge.warn, .st.in_progress { background: rgba(255,210,122,.14); color: var(--warn); }
.badge.bad { background: rgba(255,138,128,.14); color: var(--bad); } .badge.block { background: rgba(201,167,255,.14); color: var(--block); }
.st.done { background: rgba(140,184,255,.16); color: var(--blue); } .st.scheduled { background: var(--card2); color: var(--fg); } .st.cancelled { background: rgba(255,255,255,.05); color: var(--dim); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 14.5px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn.g { background: var(--card2); color: var(--fg); } .btn.d { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px rgba(255,138,128,.4); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; } .btn.lg { min-height: 52px; font-size: 16px; } .btn.w { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.empty { color: var(--muted); padding: 18px; text-align: center; font-size: 14.5px; }
.err { color: var(--bad); font-size: 14px; margin: 0; }
input[type=text], input[type=date], input[type=time], input[type=search], input[type=tel], input[type=email], input[type=number], select, textarea {
  width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); font-size: 16px; }
textarea { padding: 10px 12px; min-height: 84px; resize: vertical; line-height: 1.4; }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, #aaa 50%), linear-gradient(135deg, #aaa 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: 1px; }
label.f { display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); min-width: 0; grid-template-columns: minmax(0, 1fr); }
.fg { display: grid; gap: 12px; }
.fg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chk { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.chk input { width: 20px; height: 20px; accent-color: #ededed; flex: none; }
.wd { display: flex; gap: 6px; flex-wrap: wrap; }
.wd button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card2); color: var(--fg); font-weight: 650; cursor: pointer; }
.wd button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { border: 0; min-height: 38px; padding: 0 13px; border-radius: 999px; background: var(--card2); color: var(--fg); font-weight: 600; font-size: 14px; cursor: pointer; }
.pills button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.note { font-size: 13px; color: var(--dim); margin: 6px 0 0; }

/* schedule */
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.weeknav .lbl { font-weight: 650; }
.day { padding: 14px 16px 12px; }
.day.today { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.45); }
.day.past { opacity: .55; }
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dhead b { font-size: 16px; }
.dmeta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.bar { position: relative; height: 26px; border-radius: 8px; background: rgba(255,255,255,.035); margin: 12px 0 4px; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.bar i.free { background: rgba(143,227,165,.16); box-shadow: inset 0 0 0 1px rgba(143,227,165,.45); top: 3px; bottom: 3px; }
.bar i.event { background: rgba(255,255,255,.22); }
.bar i.block { background: repeating-linear-gradient(135deg, rgba(201,167,255,.45) 0 6px, rgba(201,167,255,.22) 6px 12px); }
.bar i.job { background: #ededed; }
.bar i.dark { background: rgba(0,0,0,.55); }
.ticks { position: relative; height: 14px; font-size: 10.5px; color: var(--dim); }
.ticks span { position: absolute; transform: translateX(-50%); }
.items { display: grid; gap: 6px; margin-top: 8px; }
.it { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.it .t { color: var(--muted); min-width: 136px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.it .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.it .dot.event { background: rgba(255,255,255,.4); } .it .dot.block { background: var(--block); } .it .dot.job { background: #ededed; } .it .dot.free { background: var(--good); }
.it .x { margin-left: auto; display: flex; gap: 6px; }
.lnk { white-space: nowrap; border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; padding: 6px; }
.it .lnk { padding: 11px 10px; margin: -9px -4px; font-size: 13.5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* rows, people, jobs */
.tap { cursor: pointer; }
.tap:active { transform: scale(.995); }
.jrow { display: flex; gap: 12px; align-items: center; }
.jrow .jm { flex: 1; min-width: 0; }
.jrow .jm > div { overflow: hidden; text-overflow: ellipsis; }
.jrow .jb { display: grid; gap: 6px; justify-items: end; }
.thumb { width: 64px; height: 48px; border-radius: 10px; object-fit: cover; background: #151515; flex: none; display: block; }
.thumb.ph { display: grid; place-items: center; color: #555; }
.thumb.ph svg { width: 22px; height: 22px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 16px; letter-spacing: .02em; color: #fff;
  background: linear-gradient(140deg, #3a3a3a, #1c1c1c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
.avatar.lg { width: 72px; height: 72px; font-size: 26px; }
.kv { display: flex; justify-content: space-between; gap: 14px; padding: 4px 0; }
.kv span { color: var(--muted); flex: 0 1 42%; } .kv b { font-weight: 600; text-align: right; flex: 1 1 58%; overflow-wrap: anywhere; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.tbl input { min-height: 38px; text-align: right; padding: 0 8px; }
.scroll { overflow-x: auto; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 15px; padding: 4px 0; margin-bottom: 8px; cursor: pointer; }
.contact { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.contact a, .contact button { display: grid; justify-items: center; gap: 4px; padding: 10px 4px; border-radius: 14px; background: var(--card2); color: var(--fg); text-decoration: none; font-size: 12.5px; font-weight: 600; border: 0; cursor: pointer; }
.contact a[aria-disabled="true"] { opacity: .35; pointer-events: none; }
.contact svg { width: 22px; height: 22px; }
.phead { display: flex; gap: 14px; align-items: center; }
.steps { display: flex; gap: 4px; margin: 12px 0 2px; }
.steps span { flex: 1; text-align: center; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; color: var(--dim); padding-top: 8px; border-top: 3px solid rgba(255,255,255,.12); }
.steps span.on { color: var(--fg); border-color: var(--fg); }
.steps span.now { color: var(--warn); border-color: var(--warn); }
.prog { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; } .prog i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.money-in { display: flex; align-items: center; gap: 8px; margin: 8px 0 12px; }
.money-in span { font-size: 22px; }
.money-in input { flex: 1 1 0; width: auto; min-width: 0; min-height: 52px; font-size: 22px; font-weight: 650; }
.vehicle { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vehicle:last-child { border-bottom: 0; }
.plate { display: inline-block; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; letter-spacing: .08em; padding: 1px 6px; border-radius: 5px; background: #ededed; color: #000; font-weight: 700; }
.logl { font-size: 13px; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--line); } .logl:last-child { border: 0; } .logl b { color: var(--dim); font-weight: 600; margin-right: 6px; }
.locked { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 6px 0; color: var(--muted); } .locked b { color: var(--fg); font-weight: 600; }
.lock-ic { font-size: 11px; color: var(--dim); }

/* photo checklist */
.angs { display: grid; gap: 8px; }
.ang { display: grid; grid-template-columns: 1fr 64px 64px 36px; gap: 8px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 14px; background: rgba(255,255,255,.04); }
.ang .an { min-width: 0; }
.ang .an b { display: block; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ang .an small { color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.ang .slot { position: relative; width: 64px; height: 48px; border-radius: 9px; overflow: hidden; background: #151515; border: 0; padding: 0; cursor: pointer; color: #666; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; }
.ang .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ang .slot .q { position: absolute; right: 3px; bottom: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px #000; }
.ang .more { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--card2); color: var(--fg); font-size: 18px; line-height: 1; cursor: pointer; }
.ang.done { box-shadow: inset 0 0 0 1px rgba(143,227,165,.35); }
.ok-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--good); color: #000; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; }
.pin-n { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #e5484d; color: #fff; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: #111; border-radius: 22px 22px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); box-shadow: 0 -1px 0 var(--line); }
.sheet h3 { margin: 0; font-size: 18px; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 22px; } }
.menu { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.menu button, .menu a { text-align: left; justify-content: flex-start; }
body.lock .toast { bottom: auto; top: calc(env(safe-area-inset-top) + 64px); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); background: #ededed; color: #000; padding: 10px 16px; border-radius: 16px; font-weight: 600; font-size: 14px; z-index: 90; max-width: 92vw; text-align: center; }

/* full-screen photo tools (photos.js) */
.fs { position: fixed; inset: 0; z-index: 50; background: #000; color: #fff; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; }
.fs-top { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; }
.fs-top .t { flex: 1; min-width: 0; text-align: center; font-weight: 650; font-size: 15px; }
.fs-top .t small { display: block; color: #aaa; font-weight: 500; font-size: 12.5px; }
.ic { width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; font-size: 15px; font-weight: 700; }
.ic svg { width: 21px; height: 21px; }
.ic[aria-pressed="true"] { background: #fff; color: #000; }
.vf-wrap { flex: 1 1 auto; min-height: 0; min-width: 0; position: relative; display: grid; place-items: center; overflow: hidden; }
.vf { position: relative; overflow: hidden; background: #0c0c0c; }
.vf video, .vf .ghost, .vf .cap { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vf .ghost { pointer-events: none; }
.vf .grid { position: absolute; inset: 0; pointer-events: none; background:
  linear-gradient(to right, transparent calc(33.333% - .5px), rgba(255,255,255,.35) calc(33.333% - .5px), rgba(255,255,255,.35) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgba(255,255,255,.35) calc(66.666% - .5px), rgba(255,255,255,.35) calc(66.666% + .5px), transparent calc(66.666% + .5px)),
  linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(255,255,255,.35) calc(33.333% - .5px), rgba(255,255,255,.35) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgba(255,255,255,.35) calc(66.666% - .5px), rgba(255,255,255,.35) calc(66.666% + .5px), transparent calc(66.666% + .5px)); }
.vf .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
.vf .flash.on { opacity: .85; transition: none; }
.vf .tag { position: absolute; left: 10px; top: 10px; font-size: 11px; font-weight: 800; letter-spacing: .14em; background: rgba(0,0,0,.55); padding: 4px 9px; border-radius: 999px; }
.vf .ref { position: absolute; right: 10px; top: 10px; width: 26%; border-radius: 8px; box-shadow: 0 0 0 2px rgba(255,255,255,.8); }
.vf .hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-size: 13px; font-weight: 600; background: rgba(0,0,0,.65); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.vf .zl { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); font-size: 13px; font-weight: 700; background: rgba(0,0,0,.55); padding: 3px 10px; border-radius: 999px; }
.vf .empty-v { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #bbb; font-size: 15px; }
.fs-bot { padding: 8px 12px calc(env(safe-area-inset-bottom) + 12px); display: grid; gap: 10px; }
.fs-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
